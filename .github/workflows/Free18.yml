name: Free18

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: free18
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: 合并订阅
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests pyyaml

      - name: 合并订阅
        run: python Scripts/Free18.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy/Free18.yaml proxy/Free18_Loon.list proxy/Free18_QuantumultX.list proxy/Free18_Shadowrocket.list proxy/Free18_Surge.list proxy/README.md Scripts/Free18_geo_cache.json
          if git diff --cached --quiet; then
            echo "无变化。"
            exit 0
          fi
          python3 <<'PYEOF' > /tmp/free18_commit_msg.txt
          import json
          s = json.load(open("Scripts/Free18_stats.json"))
          print(f"chore(Free18): update {s['total']} nodes "
                f"({s['duplicates']} duplicates removed)")
          print()
          print("Sources (parsed, pre-dedupe): " +
                ", ".join(f"{k}={v}" for k, v in s["per_source"].items()))
          failed = s.get("failed_sources") or []
          print("Failed sources: " +
                (", ".join(f["label"] for f in failed) or "none"))
          print("Per file: " +
                ", ".join(f"{k}={v['nodes']}" for k, v in s["per_file"].items()))
          PYEOF
          git commit -F /tmp/free18_commit_msg.txt
          git pull --rebase
          git push
